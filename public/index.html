<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#2a1f0f"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Sacra Scriptura"/>
<title>Sacra Scriptura</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:Georgia,serif;background:#0f0e0c;color:#e8e2d8}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#3d3a32;border-radius:3px}
button{font-family:Georgia,serif;cursor:pointer;border:none;background:none}
input,textarea{font-family:Georgia,serif;outline:none;resize:none}
input:focus,textarea:focus{border-color:#b8963e!important;box-shadow:0 0 0 2px #b8963e22!important}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.hdr{flex-shrink:0;background:#0a0905;padding:13px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e1c15;padding-top:max(13px,env(safe-area-inset-top))}
.ct{flex:1;overflow-y:auto;padding:14px 14px 0;-webkit-overflow-scrolling:touch}
.nb-bar{flex-shrink:0;display:flex;background:#0a0905;border-top:1px solid #1e1c15;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.nb{flex:1;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#3a3428;border-top:2px solid transparent;transition:all .15s;font-size:8px;letter-spacing:.8px}
.nb.active{color:#b8963e;border-top-color:#b8963e}
.bp{padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;letter-spacing:.2px;font-family:Georgia,serif}
.b1{background:#5a3e28;color:#f5ede0;border:none}
.b2{border:1px solid var(--bord,#2e2b25);color:var(--text,#e8e2d8);background:transparent}
.b3{border:1px solid #7a2e2e44;color:#c0504a;background:transparent}
button:active{opacity:.7}
.sl{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--faint,#4a4438);text-transform:uppercase;margin-bottom:8px;margin-top:4px;display:block}
.inp{width:100%;padding:9px 12px;border-radius:7px;border:1px solid var(--bord,#2e2b25);background:var(--alt,#211f1a);color:var(--text,#e8e2d8);font-size:14px}
.chip{font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid var(--bord,#2e2b25);background:var(--alt,#211f1a);color:var(--muted,#8a8070);cursor:pointer}
.modal-ov{position:fixed;inset:0;background:#00000099;z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal-sh{background:var(--surf,#1a1814);border-radius:14px 14px 0 0;padding:20px;width:100%;max-width:520px;border-top:1px solid var(--bord,#2e2b25);padding-bottom:max(24px,env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto}
.spinner{width:28px;height:28px;border:2px solid var(--bord,#2e2b25);border-top-color:#b8963e;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.tag-dc{font-size:10px;color:#d4aa55;margin-top:2px}
:root{--bg:#0f0e0c;--surf:#1a1814;--alt:#211f1a;--bord:#2e2b25;--text:#e8e2d8;--muted:#8a8070;--faint:#4a4438}
</style>
</head>
<body>

<div id="splash" style="position:fixed;inset:0;background:#0f0e0c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:999;transition:opacity .6s">
  <svg width="44" height="44" viewBox="0 0 24 24" fill="#b8963e"><path d="M10 2h4v7h7v4h-7v9h-4v-9H3v-4h7V2z"/></svg>
  <div style="color:#b8963e;font-size:17px;letter-spacing:3px">SACRA SCRIPTURA</div>
  <div style="color:#3a3020;font-size:10px;letter-spacing:2px">CATHOLIC BIBLE · 73 BOOKS</div>
  <div class="spinner" style="margin-top:8px"></div>
</div>

<!-- ADD TO COLLECTION MODAL -->
<div class="modal-ov" id="addMod" style="display:none" onclick="closeMod()">
  <div class="modal-sh" onclick="event.stopPropagation()">
    <div style="font-weight:600;font-size:16px;margin-bottom:3px">Add to Collection</div>
    <div id="modRef" style="color:var(--muted);font-size:12px;margin-bottom:14px"></div>
    <div id="modList" style="display:flex;flex-direction:column;gap:6px"></div>
    <button class="bp b2" style="width:100%;margin-top:12px" onclick="closeMod()">Cancel</button>
  </div>
</div>

<!-- STUDY NOTE MODAL -->
<div class="modal-ov" id="noteMod" style="display:none" onclick="closeNoteMod()">
  <div class="modal-sh" onclick="event.stopPropagation()">
    <div style="font-weight:600;font-size:16px;margin-bottom:3px">Study Note</div>
    <div id="noteRef" style="color:#d4aa55;font-size:12px;font-weight:600;margin-bottom:6px"></div>
    <div id="noteVerseTxt" style="font-size:13px;line-height:1.7;font-style:italic;color:var(--muted);margin-bottom:12px;padding:10px;background:var(--alt);border-radius:8px;border:1px solid var(--bord)"></div>
    <textarea id="noteTxt" style="width:100%;min-height:130px;padding:10px 12px;border-radius:7px;border:1px solid var(--bord);background:var(--alt);color:var(--text);font-size:14px;line-height:1.7;margin-bottom:10px" placeholder="Write your reflection or insight here…"></textarea>
    <div style="display:flex;gap:8px">
      <button class="bp b1" style="flex:1" onclick="saveNote()">Save Note</button>
      <button class="bp b3" id="delNoteBtn" style="display:none" onclick="deleteNote()">Delete</button>
      <button class="bp b2" onclick="closeNoteMod()">Cancel</button>
    </div>
  </div>
</div>

<div class="app">
  <div class="hdr">
    <div style="display:flex;align-items:center;gap:10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#b8963e"><path d="M10 2h4v7h7v4h-7v9h-4v-9H3v-4h7V2z"/></svg>
      <div>
        <div style="color:#b8963e;font-size:15px;font-weight:600;letter-spacing:1.5px">SACRA SCRIPTURA</div>
        <div style="color:#3a3020;font-size:9px;letter-spacing:2px">CATHOLIC BIBLE · 73 BOOKS</div>
      </div>
    </div>
    <button onclick="toggleDark()" id="dkBtn" style="border:1px solid #3d3a30;border-radius:6px;padding:4px 10px;color:#8a7a60;font-size:10px;letter-spacing:1px">LIGHT</button>
  </div>

  <div class="ct" id="ct"></div>

  <div class="nb-bar">
    <button class="nb active" id="n-home" onclick="go('home')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>HOME</span></button>
    <button class="nb" id="n-read" onclick="go('read')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg><span>READ</span></button>
    <button class="nb" id="n-search" onclick="go('search')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg><span>SEARCH</span></button>
    <button class="nb" id="n-saved" onclick="go('saved')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg><span>SAVED</span></button>
    <button class="nb" id="n-journal" onclick="go('journal')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg><span>JOURNAL</span></button>
    <button class="nb" id="n-colls" onclick="go('colls')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg><span>COLLECT.</span></button>
  </div>
</div>

  {id:"hope",name:"Holding onto Hope",mood:"Hope",color:"#2E5C8B",verses:[{r:"Romans 15:13",t:"May the God of hope fill you with all joy and peace as you trust in him.",bk:"Romans"},{r:"Jeremiah 29:11",t:"For I know the plans I have for you, declares the Lord, plans for welfare and not for evil, to give you a future and a hope.",bk:"Jeremiah"}]},
];

const MOODS=["Peaceful","Grateful","Joyful","Reflective","Sorrowful","Hopeful","Struggling","Thankful"];

// ── STATE ──────────────────────────────────────────────────────────────
let S={
  tab:"home",dark:true,
  favs:[],hls:{},colls:JSON.parse(JSON.stringify(DEFCOLLS)),
  notes:{},journal:[],
  book:null,bsearch:"",tfilt:"ALL",
  addV:null,noteV:null,
  searchQ:"",searchRes:[],searching:false,
  activeColl:null,showNewColl:false,newCollName:"",
  journalEdit:null,journalTitle:"",journalText:"",journalMood:"",
};

// ── STORAGE ────────────────────────────────────────────────────────────
function save(){try{localStorage.setItem("ss5",JSON.stringify({favs:S.favs,hls:S.hls,colls:S.colls,notes:S.notes,journal:S.journal,dark:S.dark}));}catch{}}
function load(){try{const d=JSON.parse(localStorage.getItem("ss5")||"{}");if(d.favs)S.favs=d.favs;if(d.hls)S.hls=d.hls;if(d.colls)S.colls=d.colls;if(d.notes)S.notes=d.notes;if(d.journal)S.journal=d.journal;if(d.dark!==undefined)S.dark=d.dark;}catch{}}

// ── THEME ──────────────────────────────────────────────────────────────
function applyTheme(){
  const d=S.dark;
  document.documentElement.style.setProperty("--surf",d?"#1a1814":"#ffffff");
  document.documentElement.style.setProperty("--alt",d?"#211f1a":"#f2ede6");
  document.documentElement.style.setProperty("--bord",d?"#2e2b25":"#ddd6cc");
  document.documentElement.style.setProperty("--text",d?"#e8e2d8":"#1e1a14");
  document.documentElement.style.setProperty("--muted",d?"#8a8070":"#6b6055");
  document.documentElement.style.setProperty("--faint",d?"#4a4438":"#b0a898");
  document.body.style.background=d?"#0f0e0c":"#f7f4ef";
  document.body.style.color=d?"#e8e2d8":"#1e1a14";
  document.querySelector(".hdr").style.background=d?"#0a0905":"#2a1f0f";
  document.querySelector(".nb-bar").style.background=d?"#0a0905":"#2a1f0f";
  document.getElementById("dkBtn").textContent=d?"LIGHT":"DARK";
}
window.toggleDark=function(){S.dark=!S.dark;save();applyTheme();render();};

// ── NAV ────────────────────────────────────────────────────────────────
function go(t){S.tab=t;document.querySelectorAll(".nb").forEach(b=>b.classList.remove("active"));const nb=document.getElementById("n-"+t);if(nb)nb.classList.add("active");render();}
window.go=go;

// ── HELPERS ────────────────────────────────────────────────────────────
const isFav=r=>S.favs.some(f=>f.r===r||f.ref===r);

function togFav(r,t,bk){
  if(isFav(r)){S.favs=S.favs.filter(f=>f.r!==r&&f.ref!==r);}
  else{S.favs.push({r,t,bk});}
  save();render();
}
window.togFav=togFav;

function openAdd(r,t,bk){
  S.addV={r,t,bk};
  document.getElementById("modRef").textContent=r;
  const l=document.getElementById("modList");l.innerHTML="";
  S.colls.forEach(p=>{
    const has=p.verses.some(v=>(v.r||v.ref)===r);
    const b=document.createElement("button");
    b.className="bp b2";b.style.cssText="width:100%;text-align:left;display:flex;align-items:center;gap:10px;margin-bottom:4px;"+(has?"opacity:.5":"");
    b.innerHTML=`<div style="width:8px;height:8px;border-radius:50%;background:${p.color};flex-shrink:0"></div><span style="flex:1">${p.name}</span><span style="color:var(--faint);font-size:11px">${has?"Added ✓":p.verses.length+"v"}</span>`;
    if(!has)b.onclick=()=>{p.verses.push({r,t,bk});save();closeMod();};
    l.appendChild(b);
  });
  document.getElementById("addMod").style.display="flex";
}
function closeMod(){document.getElementById("addMod").style.display="none";}
window.openAdd=openAdd;window.closeMod=closeMod;

function openNote(r,t){
  S.noteV={r,t};
  const ex=S.notes[r]||{};
  document.getElementById("noteRef").textContent=r;
  document.getElementById("noteVerseTxt").textContent="\u201C"+t+"\u201D";
  document.getElementById("noteTxt").value=ex.text||"";
  document.getElementById("delNoteBtn").style.display=ex.text?"inline-flex":"none";
  document.getElementById("noteMod").style.display="flex";
  setTimeout(()=>document.getElementById("noteTxt").focus(),100);
}
function saveNote(){
  const t=document.getElementById("noteTxt").value.trim();
  if(t)S.notes[S.noteV.r]={text:t,date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})};
  else delete S.notes[S.noteV.r];
  save();closeNoteMod();render();
}
function deleteNote(){delete S.notes[S.noteV.r];save();closeNoteMod();render();}
function closeNoteMod(){document.getElementById("noteMod").style.display="none";}
window.openNote=openNote;window.saveNote=saveNote;window.deleteNote=deleteNote;window.closeNoteMod=closeNoteMod;

// ── SEARCH ─────────────────────────────────────────────────────────────
function doSearch(){
  const q=(document.getElementById("sqinp")||{value:""}).value.trim().toLowerCase();
  if(!q||q.length<2)return;
  S.searchQ=q;S.searchRes=[];
  // Search across all highlight verses
  Object.entries(H).forEach(([book,verses])=>{
    verses.forEach(v=>{
      if(v.t.toLowerCase().includes(q)||v.r.toLowerCase().includes(q)){
        S.searchRes.push({r:v.r,t:v.t,bk:book});
      }
    });
  });
  render();
}
window.doSearch=doSearch;

// ── JOURNAL ────────────────────────────────────────────────────────────
function saveJournal(){
  const title=(document.getElementById("jtitle")||{value:""}).value.trim();
  const text=(document.getElementById("jtext")||{value:""}).value.trim();
  if(!text)return;
  if(S.journalEdit){S.journal=S.journal.map(j=>j.id===S.journalEdit?{...j,title,text,mood:S.journalMood}:j);}
  else{S.journal.unshift({id:Date.now().toString(),title:title||"Reflection",text,mood:S.journalMood,date:new Date().toLocaleDateString("en-US",{weekday:"short",month:"long",day:"numeric",year:"numeric"})});}
  S.journalEdit=null;S.journalTitle="";S.journalText="";S.journalMood="";
  save();render();
}
function delJournal(id){S.journal=S.journal.filter(j=>j.id!==id);save();render();}
window.saveJournal=saveJournal;window.delJournal=delJournal;

  // ── READ ──
  if(S.tab==="read"){
    if(!S.book){

          <div style="display:flex;gap:6px;flex-wrap:wrap">${MOODS.map(m=>`<button class="chip" style="${S.journalMood===m?"background:#5a3e28;color:#f5ede0;border-color:#5a3e28":""}" onclick="S.journalMood='${m}';document.querySelectorAll('.chip').forEach(c=>{c.style.background='';c.style.color='';c.style.borderColor='';});this.style.background='#5a3e28';this.style.color='#f5ede0';this.style.borderColor='#5a3e28'">${m}</button>`).join("")}</div>

        <textarea id="jtext" style="width:100%;min-height:110px;padding:10px 12px;border-radius:7px;border:1px solid var(--bord);background:var(--alt);color:var(--text);font-size:14px;line-height:1.7;margin-bottom:10px" placeholder="Write your prayer, reflection, or meditation…">${S.journalText||""}</textarea>
        <div style="display:flex;gap:8px">
          <button class="bp b1" style="flex:1" onclick="S.journalTitle=document.getElementById('jtitle').value;S.journalText=document.getElementById('jtext').value;saveJournal()">Save Entry</button>
          ${editing?`<button class="bp b3" onclick="delJournal('${S.journalEdit}')">Delete</button>`:""}
        </div>
      </div>
      ${S.journal.map(j=>`<div style="background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:14px;margin-bottom:10px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px">
          <div><div style="font-weight:600;font-size:15px;color:var(--text)">${j.title||"Reflection"}</div><div style="font-size:11px;color:var(--faint);margin-top:2px">${j.date}${j.mood?" · "+j.mood:""}</div></div>
          <button class="bp b2" style="font-size:11px;flex-shrink:0;padding:5px 10px" onclick="S.journalEdit='${j.id}';S.journalTitle=\`${j.title||""}\`;S.journalText=\`${j.text.replace(/`/g,"'")}\`;S.journalMood='${j.mood||""}';render()">Edit</button>
        </div>
        <p style="font-size:13px;color:var(--muted);line-height:1.7;margin:0">${j.text.slice(0,200)}${j.text.length>200?"…":""}</p>
      </div>`).join("")}
      <div style="padding-bottom:20px"></div>`;
    return;
  }

  // ── COLLECTIONS ──
  if(S.tab==="colls"){
    if(!S.activeColl){
      c.innerHTML=`
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <div><div style="font-weight:600;font-size:18px">Collections</div><div style="color:var(--muted);font-size:13px;margin-top:2px">Verse collections by mood & theme</div></div>
          <button class="bp b1" onclick="S.showNewColl=true;render()">New</button>
        </div>
        ${S.showNewColl?`<div style="background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:14px;margin-bottom:12px">
          <div style="font-size:13px;color:var(--muted);margin-bottom:8px">Collection name</div>
          <input id="ncInput" class="inp" style="margin-bottom:10px" placeholder="e.g. Morning Prayer…"/>
          <div style="display:flex;gap:8px">
            <button class="bp b1" onclick="const v=document.getElementById('ncInput').value.trim();if(v){S.colls.push({id:Date.now().toString(),name:v,mood:'',color:'#5a3e28',verses:[]});save();}S.showNewColl=false;render()">Create</button>
            <button class="bp b2" onclick="S.showNewColl=false;render()">Cancel</button>
          </div></div>`:""}
        ${S.colls.map(p=>`<button onclick="S.activeColl=S.colls.find(c=>c.id==='${p.id}');render()" style="background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:14px;margin-bottom:10px;width:100%;text-align:left;display:flex;align-items:center;gap:14px;cursor:pointer">
          <div style="width:3px;height:44px;border-radius:2px;background:${p.color};flex-shrink:0"></div>
          <div style="flex:1"><div style="font-weight:500;font-size:15px;color:var(--text)">${p.name}</div>${p.mood?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${p.mood.toUpperCase()}</div>`:""}</div>
          <div style="color:var(--muted);font-size:12px;margin-right:4px">${p.verses.length}v</div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>`).join("")}
        <div style="padding-bottom:20px"></div>`;
    } else {
      const ac=S.activeColl;
      c.innerHTML=`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
          <button class="bp b2" onclick="S.activeColl=null;render()">← Collections</button>
          <div style="flex:1"><div style="display:flex;align-items:center;gap:8px"><div style="width:3px;height:18px;border-radius:2px;background:${ac.color}"></div><div style="font-weight:600;font-size:16px">${ac.name}</div></div><div style="color:var(--muted);font-size:12px;margin-top:2px">${ac.verses.length} verses</div></div>
        </div>
        ${ac.verses.length===0?`<div style="background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:30px;text-align:center;color:var(--muted)">No verses yet. Save verses while reading and add them here.</div>`:""}
        ${ac.verses.map(v=>{
          const ref=v.r||v.ref;const text=v.t||v.text;
          const esc=s=>String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
          return `<div style="background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:14px;margin-bottom:10px">
            <div style="color:#d4aa55;font-size:12px;font-weight:600;margin-bottom:7px">${ref}</div>
            <p style="font-size:14px;line-height:1.8;font-style:italic;margin:0 0 12px">&ldquo;${text}&rdquo;</p>
            <button class="bp b3" style="font-size:12px" onclick="S.colls=S.colls.map(p=>{if(p.id==='${ac.id}'){p.verses=p.verses.filter(vv=>(vv.r||vv.ref)!=='${esc(ref)}')}return p});S.activeColl=S.colls.find(p=>p.id==='${ac.id}');save();render()">Remove</button>
          </div>`;
        }).join("")}
        <div style="padding-bottom:20px"></div>`;
    }
    return;
  }
}

// ── BOOT ───────────────────────────────────────────────────────────────
window.addEventListener("load",()=>{
  load();
  // PWA manifest
  const mf={name:"Sacra Scriptura",short_name:"Bible",start_url:"./",display:"standalone",background_color:"#0f0e0c",theme_color:"#2a1f0f",icons:[{src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' fill='%232a1f0f'/><text x='96' y='138' font-size='110' text-anchor='middle' fill='%23b8963e'>✝</text></svg>",sizes:"192x192",type:"image/svg+xml"}]};
  const bl=new Blob([JSON.stringify(mf)],{type:"application/json"});
  const lk=document.createElement("link");lk.rel="manifest";lk.href=URL.createObjectURL(bl);document.head.appendChild(lk);
  if("serviceWorker" in navigator){
    const sw=`const C="ss-v2";self.addEventListener("install",e=>e.waitUntil(caches.open(C).then(c=>c.add("/"))));self.addEventListener("fetch",e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});`;
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"application/javascript"}))).catch(()=>{});
  }
  setTimeout(()=>{
    const sp=document.getElementById("splash");sp.style.opacity="0";
    setTimeout(()=>sp.style.display="none",600);
    applyTheme();render();
  },800);
});

window.S=S;window.BOOKS=BOOKS;window.H=H;
</script>
</body>
</html>
